<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a0d" />
  <meta name="description" content="AegisQ — Make Cryptographic Risk Visible. Presentation slideshow." />
  <title>AegisQ — Presentation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0d;
      --panel: rgba(22, 23, 27, .94);
      --line: rgba(242, 178, 64, .28);
      --gold: #f2b240;
      --muted: #a7a6a2;
      --white: #f5f3ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--white); }
    .app { height: 100dvh; min-height: 100%; display: grid; grid-template-rows: 4px auto 1fr auto; }
    .progress-track { height: 4px; background: #202126; }
    .progress-fill { height: 100%; width: 16.6667%; background: var(--gold); transition: width .25s ease; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px clamp(14px, 3vw, 34px); border-bottom: 1px solid rgba(255,255,255,.07); }
    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 14px; letter-spacing: .12em; color: var(--gold); }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .tools { display: flex; align-items: center; gap: 8px; }
    button, a.tool { color: var(--white); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; min-height: 36px; padding: 8px 12px; font: inherit; font-size: 12px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    button:hover, a.tool:hover { border-color: var(--gold); background: #252322; }
    button:disabled { opacity: .35; cursor: default; }
    main { position: relative; display: grid; place-items: center; min-height: 0; padding: clamp(8px, 1.5vw, 18px); }
    .stage { position: relative; width: min(100%, calc((100dvh - 142px) * 1.7778)); max-height: 100%; aspect-ratio: 16 / 9; display: grid; place-items: center; }
    .slide { display: none; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; border: 1px solid rgba(242,178,64,.18); box-shadow: 0 18px 70px rgba(0,0,0,.48); }
    .slide.active { display: block; animation: appear .22s ease-out; }
    @keyframes appear { from { opacity: .65; transform: scale(.995); } to { opacity: 1; transform: scale(1); } }
    .edge { position: absolute; top: 0; bottom: 0; width: 17%; border: 0; border-radius: 0; background: transparent; opacity: 0; }
    .edge:hover { opacity: 1; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); }
    .edge.prev { left: 0; }
    .edge.next { right: 0; transform: scaleX(-1); }
    .edge:focus-visible { opacity: 1; outline: 2px solid var(--gold); }
    footer { min-height: 58px; padding: 9px clamp(14px, 3vw, 34px) max(10px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid rgba(255,255,255,.07); background: rgba(9,10,13,.96); }
    .nav { display: flex; align-items: center; gap: 8px; }
    .counter { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 52px; text-align: center; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 8px; height: 8px; min-height: 8px; padding: 0; border-radius: 50%; border: 0; background: #55565c; }
    .dot.active { width: 22px; border-radius: 8px; background: var(--gold); }
    .hint { color: #8d8d91; font-size: 11px; white-space: nowrap; }
    .toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); padding: 9px 13px; border-radius: 8px; color: var(--white); background: #262321; border: 1px solid var(--line); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
    @media (max-width: 620px) {
      header { padding: 9px 11px; }
      .brand strong { font-size: 12px; }
      .brand span, .hint, .download-label { display: none; }
      button, a.tool { min-height: 34px; padding: 7px 9px; }
      main { padding: 4px; }
      .stage { width: 100%; }
      footer { min-height: 54px; padding: 7px 10px max(8px, env(safe-area-inset-bottom)); }
      .dots { gap: 5px; }
      .dot { width: 7px; height: 7px; min-height: 7px; }
      .dot.active { width: 17px; }
    }
    :fullscreen .app { height: 100vh; }
    :fullscreen header, :fullscreen footer { background: rgba(9,10,13,.98); }
  </style>
</head>
<body>
  <div class="app">
    <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
    <header>
      <div class="brand"><strong>AEGISQ</strong><span>MAKE CRYPTOGRAPHIC RISK VISIBLE</span></div>
      <div class="tools">
        <a class="tool" href="AegisQ_slide_presentation.pptx" download title="Download the PowerPoint"><span>↓</span><span class="download-label">PPTX</span></a>
        <button id="fullscreen" type="button" title="Enter full screen (F)">⛶ <span class="download-label">Full screen</span></button>
      </div>
    </header>
    <main id="main" aria-label="Presentation slideshow">
      <div class="stage" id="stage">
        <img class="slide active" src="slides/slide-1.png" alt="Slide 1 of 6: The cryptographic blind spot" draggable="false" />
        <img class="slide" src="slides/slide-2.png" alt="Slide 2 of 6: Meet AegisQ" draggable="false" />
        <img class="slide" src="slides/slide-3.png" alt="Slide 3 of 6: Technical approach, feasibility and risks" draggable="false" />
        <img class="slide" src="slides/slide-4.png" alt="Slide 4 of 6: Six steps from software input to action" draggable="false" />
        <img class="slide" src="slides/slide-5.png" alt="Slide 5 of 6: Impact and benefits" draggable="false" />
        <img class="slide" src="slides/slide-6.png" alt="Slide 6 of 6: Research and references" draggable="false" />
        <button class="edge prev" id="tapPrev" type="button" aria-label="Previous slide"></button>
        <button class="edge next" id="tapNext" type="button" aria-label="Next slide"></button>
      </div>
    </main>
    <footer>
      <div class="nav">
        <button id="prev" type="button" aria-label="Previous slide">←</button>
        <span class="counter" id="counter" aria-live="polite">01 / 06</span>
        <button id="next" type="button" aria-label="Next slide">→</button>
      </div>
      <div class="dots" id="dots" aria-label="Choose slide">
        <button class="dot active" data-slide="0" aria-label="Go to slide 1"></button>
        <button class="dot" data-slide="1" aria-label="Go to slide 2"></button>
        <button class="dot" data-slide="2" aria-label="Go to slide 3"></button>
        <button class="dot" data-slide="3" aria-label="Go to slide 4"></button>
        <button class="dot" data-slide="4" aria-label="Go to slide 5"></button>
        <button class="dot" data-slide="5" aria-label="Go to slide 6"></button>
      </div>
      <div class="hint">← → Navigate&nbsp;&nbsp; • &nbsp;F Full screen&nbsp;&nbsp; • &nbsp;Esc Exit</div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const dots = [...document.querySelectorAll('.dot')];
      const counter = document.getElementById('counter');
      const progress = document.getElementById('progress');
      const prevButtons = [document.getElementById('prev'), document.getElementById('tapPrev')];
      const nextButtons = [document.getElementById('next'), document.getElementById('tapNext')];
      const stage = document.getElementById('stage');
      const toast = document.getElementById('toast');
      let current = 0;
      let touchStartX = null;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
      }
      function goTo(index) {
        current = Math.max(0, Math.min(slides.length - 1, index));
        slides.forEach((slide, i) => {
          slide.classList.toggle('active', i === current);
          slide.setAttribute('aria-hidden', i === current ? 'false' : 'true');
        });
        dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
        counter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
        progress.style.width = `${((current + 1) / slides.length) * 100}%`;
        document.getElementById('prev').disabled = current === 0;
        document.getElementById('next').disabled = current === slides.length - 1;
        document.title = `AegisQ — Slide ${current + 1} of ${slides.length}`;
      }
      prevButtons.forEach(button => button.addEventListener('click', () => goTo(current - 1)));
      nextButtons.forEach(button => button.addEventListener('click', () => goTo(current + 1)));
      dots.forEach(dot => dot.addEventListener('click', () => goTo(Number(dot.dataset.slide))));
      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) { showToast('Use your browser’s full-screen option for this page.'); }
      }
      document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
      document.addEventListener('keydown', event => {
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); goTo(current + 1); }
        else if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); goTo(current - 1); }
        else if (event.key === 'Home') goTo(0);
        else if (event.key === 'End') goTo(slides.length - 1);
        else if (event.key.toLowerCase() === 'f') toggleFullscreen();
      });
      stage.addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].screenX; }, {passive: true});
      stage.addEventListener('touchend', event => {
        if (touchStartX === null) return;
        const delta = event.changedTouches[0].screenX - touchStartX;
        if (Math.abs(delta) > 45) goTo(current + (delta < 0 ? 1 : -1));
        touchStartX = null;
      }, {passive: true});
      goTo(0);
    })();
  </script>
</body>
</html>
